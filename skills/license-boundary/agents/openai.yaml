interface:
  display_name: "License Boundary"
  short_description: "Choose repository licenses from goals and rights"
  default_prompt: "Use $license-boundary to choose or audit this repository's license from permission goals and rights evidence. If the choice is open, recommend one best-fit license and scope; if exact terms are selected, verify them without reopening the choice. Edit only after exact selection and file-edit authorization."
policy:
  allow_implicit_invocation: true
