<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1180" viewBox="0 0 2100 1180" role="img">
<!-- svg-source:excalidraw -->
<!-- projection-language:en --><metadata/><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#738197"/>
      </marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1C2A3D" flood-opacity="0.06"/>
      </filter>
    </defs>
<rect x="0" y="0" width="2100" height="1180" rx="0" fill="#FBFCFE" stroke="none" stroke-width="0"/><text x="90" y="92" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="48" font-weight="750" fill="#1C2A3D" text-anchor="start">License Boundary Decision Architecture</text><text x="90" y="137" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="22" font-weight="400" fill="#66758B" text-anchor="start">From permission goals to a rights-aware, repository-wide licensing change</text><line x1="90" y1="178" x2="2010" y2="178" stroke="#DCE3EC" stroke-width="2" stroke-linecap="round"/><text x="90" y="220" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="16" font-weight="700" fill="#66758B" text-anchor="start" letter-spacing="2.2">INPUTS</text><text x="720" y="220" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="16" font-weight="700" fill="#66758B" text-anchor="start" letter-spacing="2.2">DECISION</text><text x="1590" y="220" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="16" font-weight="700" fill="#66758B" text-anchor="start" letter-spacing="2.2">IMPLEMENTATION</text><g filter="url(#shadow)"><rect x="90" y="250" width="500" height="250" rx="26" fill="#EDF4FC" stroke="#315F96" stroke-width="2.2"/></g><circle cx="140" cy="296" r="18" fill="#315F96"/><text x="140" y="303" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="174" y="303" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="20" font-weight="700" fill="#315F96" text-anchor="start" letter-spacing="0.5">PERMISSION GOALS</text><line x1="122" y1="334" x2="558" y2="334" stroke="#CAD8E8" stroke-width="1.5" stroke-linecap="round"/><text x="122" y="375" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#1C2A3D" text-anchor="start">What should others be allowed to do?</text><text x="130" y="420" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#1C2A3D" text-anchor="start"><tspan x="130" dy="0">• internal use</tspan><tspan x="130" dy="34">• commercial use, sale, or hosted provision</tspan><tspan x="130" dy="34">• modification, redistribution, or source sharing</tspan></text><g filter="url(#shadow)"><rect x="90" y="545" width="500" height="250" rx="26" fill="#F0F4F8" stroke="#55677E" stroke-width="2.2"/></g><circle cx="140" cy="591" r="18" fill="#55677E"/><text x="140" y="598" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="174" y="598" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="20" font-weight="700" fill="#55677E" text-anchor="start" letter-spacing="0.5">RIGHTS EVIDENCE</text><line x1="122" y1="629" x2="558" y2="629" stroke="#D3DBE4" stroke-width="1.5" stroke-linecap="round"/><text x="122" y="670" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#1C2A3D" text-anchor="start">What can this licensor actually grant?</text><text x="130" y="715" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#1C2A3D" text-anchor="start"><tspan x="130" dy="0">• project-original work and contributors</tspan><tspan x="130" dy="34">• upstream or fork lineage</tspan><tspan x="130" dy="34">• third-party material and earlier grants</tspan></text><g filter="url(#shadow)"><rect x="720" y="325" width="520" height="390" rx="28" fill="#EAF6F3" stroke="#2F756C" stroke-width="2.4"/></g><circle cx="774" cy="378" r="18" fill="#2F756C"/><text x="774" y="385" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="808" y="385" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F756C" text-anchor="start" letter-spacing="0.5">LICENSE + SCOPE</text><line x1="756" y1="418" x2="1204" y2="418" stroke="#C6DED9" stroke-width="1.5" stroke-linecap="round"/><text x="980" y="480" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="29" font-weight="700" fill="#1C2A3D" text-anchor="middle">One best-fit recommendation</text><text x="980" y="535" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="21" font-weight="400" fill="#1C2A3D" text-anchor="middle"><tspan x="980" dy="0">few materially different alternatives</tspan><tspan x="980" dy="38">path-level scope where needed</tspan></text><line x1="792" y1="625" x2="1168" y2="625" stroke="#C6DED9" stroke-width="1.5" stroke-linecap="round"/><text x="980" y="668" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F756C" text-anchor="middle" letter-spacing="0.7">DESIRED POLICY  ≠  LEGAL AUTHORITY</text><g filter="url(#shadow)"><rect x="1310" y="412" width="210" height="205" rx="30" fill="#FFF5D7" stroke="#A97316" stroke-width="2.3"/></g><text x="1415" y="455" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="15" font-weight="750" fill="#A97316" text-anchor="middle" letter-spacing="1.5">CONFIRM</text><text x="1415" y="505" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="29" font-weight="750" fill="#1C2A3D" text-anchor="middle"><tspan x="1415" dy="0">USER</tspan><tspan x="1415" dy="38">CONFIRMS</tspan></text><text x="1415" y="580" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="15" font-weight="600" fill="#A97316" text-anchor="middle"><tspan x="1415" dy="0">exact terms</tspan><tspan x="1415" dy="24">+ edit authority</tspan></text><g filter="url(#shadow)"><rect x="1590" y="285" width="420" height="390" rx="28" fill="#F2EFFA" stroke="#68599D" stroke-width="2.3"/></g><circle cx="1642" cy="338" r="18" fill="#68599D"/><text x="1642" y="345" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1676" y="345" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="20" font-weight="700" fill="#68599D" text-anchor="start" letter-spacing="0.5">REPOSITORY LANDING</text><line x1="1624" y1="378" x2="1976" y2="378" stroke="#D8D0EB" stroke-width="1.5" stroke-linecap="round"/><text x="1640" y="438" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">LICENSE</text><text x="1825" y="438" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">README</text><text x="1640" y="484" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">LICENSING</text><text x="1825" y="484" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">metadata</text><text x="1640" y="530" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">NOTICE</text><text x="1825" y="530" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">CONTRIBUTING</text><text x="1640" y="576" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#1C2A3D" text-anchor="start">LICENSE-HISTORY</text><text x="1800" y="636" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="15" font-weight="700" fill="#68599D" text-anchor="middle">smallest complete change</text><g filter="url(#shadow)"><rect x="1590" y="725" width="420" height="155" rx="26" fill="#EDF6F0" stroke="#4B7E62" stroke-width="2.2"/></g><circle cx="1642" cy="772" r="18" fill="#4B7E62"/><text x="1642" y="779" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1676" y="779" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="21" font-weight="700" fill="#4B7E62" text-anchor="start" letter-spacing="0.5">VERIFY</text><text x="1800" y="824" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="550" fill="#1C2A3D" text-anchor="middle"><tspan x="1800" dy="0">diff · links · notices</tspan><tspan x="1800" dy="30">metadata · history · checks</tspan></text><rect x="720" y="790" width="800" height="120" rx="24" fill="#FFF1EF" stroke="#B2574C" stroke-width="2.1" stroke-dasharray="10 8"/><circle cx="762" cy="850" r="22" fill="#B2574C"/><text x="762" y="858" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="808" y="832" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="19" font-weight="750" fill="#B2574C" text-anchor="start" letter-spacing="0.6">AUTHORITY UNRESOLVED</text><text x="808" y="870" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="500" fill="#1C2A3D" text-anchor="start">Stop, report the boundary, and request professional review when needed.</text><path d="M 590 375 H 655 V 440 H 720" fill="none" stroke="#738197" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 590 670 H 655 V 590 H 720" fill="none" stroke="#738197" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1240 515 H 1310" fill="none" stroke="#738197" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1520 515 H 1590" fill="none" stroke="#738197" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1800 675 V 725" fill="none" stroke="#738197" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 590 735 H 655 V 850 H 720" fill="none" stroke="#B2574C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow)"/><line x1="90" y1="988" x2="2010" y2="988" stroke="#DCE3EC" stroke-width="2" stroke-linecap="round"/><text x="90" y="1035" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="18" font-weight="700" fill="#1C2A3D" text-anchor="start">A licensing decision does not authorize commit, push, PR, merge, or release.</text><text x="2010" y="1090" font-family="Inter, Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif" font-size="16" font-weight="400" fill="#66758B" text-anchor="end">Created by Faye &amp; Cove  ·  IndelibleVivi/license-boundary</text>
</svg>
