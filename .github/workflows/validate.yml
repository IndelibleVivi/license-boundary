name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate repository and distributed Skill
        run: |
          python3 scripts/validate_release.py
          python3 scripts/validate_architecture.py
